# /srv/apps/arvand-company/compose.yaml: the company site (English + Persian, Next.js standalone server).
# No database. The image is built in CI and only pulled here. .env next to this
# file holds IMAGE_TAG (the commit SHA to run).
name: arvand-company

services:
  web:
    image: ghcr.io/ali-moradi-design/arvand-company-web:${IMAGE_TAG:?IMAGE_TAG is not set}
    # Nginx on the host proxies to this; Docker bypasses ufw, so loopback only
    ports:
      - "127.0.0.1:3110:3000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    restart: unless-stopped
